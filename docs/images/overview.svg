<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Chess Robot Arm Simulation Overview</title>
  <desc id="desc">2D chess board, FastAPI server, AI engine, and 3D robot arm rendering architecture overview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202a"/>
      <stop offset="1" stop-color="#0f1419"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .label { font: 700 24px Inter, Arial, sans-serif; fill: #eef4fa; }
      .small { font: 500 16px Inter, Arial, sans-serif; fill: #b9c5d0; }
      .tiny { font: 700 13px Inter, Arial, sans-serif; fill: #dae3ea; }
      .box { fill: #202933; stroke: #3a4654; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .accent { fill: #f2c14e; }
      .blue { fill: #4f8cc9; }
      .green { fill: #6da66f; }
      .red { fill: #d95f4f; }
      .line { stroke: #7f8ea0; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #435363; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7f8ea0"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>

  <text x="60" y="64" class="label">AI Chess Robot Arm 3D Simulation</text>
  <text x="60" y="94" class="small">2D 체스 입력, AI 의사결정, WebSocket 이벤트, 3D 로봇팔 애니메이션을 분리한 구조</text>

  <rect x="60" y="140" width="285" height="360" class="box"/>
  <text x="94" y="178" class="label">Browser UI</text>
  <text x="94" y="206" class="small">web/static</text>

  <g transform="translate(95 238)">
    <rect x="0" y="0" width="184" height="184" fill="#11161b" stroke="#0b0f13" stroke-width="4"/>
    <g>
      <rect x="0" y="0" width="46" height="46" fill="#d9c79f"/>
      <rect x="46" y="0" width="46" height="46" fill="#62775a"/>
      <rect x="92" y="0" width="46" height="46" fill="#d9c79f"/>
      <rect x="138" y="0" width="46" height="46" fill="#62775a"/>
      <rect x="0" y="46" width="46" height="46" fill="#62775a"/>
      <rect x="46" y="46" width="46" height="46" fill="#d9c79f"/>
      <rect x="92" y="46" width="46" height="46" fill="#62775a"/>
      <rect x="138" y="46" width="46" height="46" fill="#d9c79f"/>
      <rect x="0" y="92" width="46" height="46" fill="#d9c79f"/>
      <rect x="46" y="92" width="46" height="46" fill="#62775a"/>
      <rect x="92" y="92" width="46" height="46" fill="#d9c79f"/>
      <rect x="138" y="92" width="46" height="46" fill="#62775a"/>
      <rect x="0" y="138" width="46" height="46" fill="#62775a"/>
      <rect x="46" y="138" width="46" height="46" fill="#d9c79f"/>
      <rect x="92" y="138" width="46" height="46" fill="#62775a"/>
      <rect x="138" y="138" width="46" height="46" fill="#d9c79f"/>
    </g>
    <text x="20" y="35" font-family="Georgia, serif" font-size="30" fill="#20252b">♜</text>
    <text x="67" y="35" font-family="Georgia, serif" font-size="30" fill="#20252b">♞</text>
    <text x="113" y="35" font-family="Georgia, serif" font-size="30" fill="#20252b">♛</text>
    <text x="158" y="35" font-family="Georgia, serif" font-size="30" fill="#20252b">♚</text>
    <text x="18" y="174" font-family="Georgia, serif" font-size="30" fill="#f5efe1">♖</text>
    <text x="67" y="174" font-family="Georgia, serif" font-size="30" fill="#f5efe1">♘</text>
    <text x="112" y="174" font-family="Georgia, serif" font-size="30" fill="#f5efe1">♕</text>
    <text x="157" y="174" font-family="Georgia, serif" font-size="30" fill="#f5efe1">♔</text>
  </g>

  <text x="94" y="464" class="small">2D board click input</text>
  <text x="94" y="489" class="small">Three.js top/arm views</text>

  <rect x="455" y="140" width="290" height="360" class="box"/>
  <text x="489" y="178" class="label">FastAPI Server</text>
  <text x="489" y="206" class="small">web/app.py</text>

  <g transform="translate(495 245)">
    <rect x="0" y="0" width="210" height="58" rx="10" fill="#263442" stroke="#3d4a57"/>
    <text x="18" y="36" class="tiny">POST /api/move</text>
    <rect x="0" y="78" width="210" height="58" rx="10" fill="#263442" stroke="#3d4a57"/>
    <text x="18" y="114" class="tiny">python-chess legal moves</text>
    <rect x="0" y="156" width="210" height="58" rx="10" fill="#263442" stroke="#3d4a57"/>
    <text x="18" y="192" class="tiny">WebSocket move event</text>
  </g>

  <rect x="850" y="140" width="290" height="360" class="box"/>
  <text x="884" y="178" class="label">AI + Robotics</text>
  <text x="884" y="206" class="small">ai/ + sim/ + MuJoCo</text>

  <g transform="translate(890 244)">
    <rect x="0" y="0" width="210" height="58" rx="10" fill="#263442" stroke="#3d4a57"/>
    <circle cx="24" cy="29" r="9" class="accent"/>
    <text x="44" y="35" class="tiny">Minimax + Alpha-Beta</text>
    <rect x="0" y="80" width="210" height="58" rx="10" fill="#263442" stroke="#3d4a57"/>
    <circle cx="24" cy="109" r="9" class="blue"/>
    <text x="44" y="115" class="tiny">IK + trajectory planning</text>
    <rect x="0" y="160" width="210" height="58" rx="10" fill="#263442" stroke="#3d4a57"/>
    <circle cx="24" cy="189" r="9" class="green"/>
    <text x="44" y="195" class="tiny">MuJoCo headless / GUI</text>
  </g>

  <path d="M 345 320 C 390 320 405 320 455 320" class="line"/>
  <text x="374" y="300" class="tiny">HTTP</text>

  <path d="M 745 320 C 790 320 805 320 850 320" class="line"/>
  <text x="774" y="300" class="tiny">FEN</text>

  <path d="M 850 410 C 760 560 405 560 315 430" class="line"/>
  <text x="544" y="574" class="tiny">WebSocket animation event</text>

  <g transform="translate(932 506)">
    <circle cx="0" cy="0" r="20" fill="#414953"/>
    <circle cx="58" cy="-38" r="14" class="blue"/>
    <circle cx="112" cy="-12" r="12" class="accent"/>
    <line x1="0" y1="0" x2="58" y2="-38" stroke="#9aa6b2" stroke-width="12" stroke-linecap="round"/>
    <line x1="58" y1="-38" x2="112" y2="-12" stroke="#9aa6b2" stroke-width="10" stroke-linecap="round"/>
    <circle cx="112" cy="-12" r="13" class="red"/>
  </g>

  <text x="60" y="565" class="small">Goal: maintainable modular architecture for AI chess, robot planning, MuJoCo simulation, and browser visualization.</text>
</svg>
